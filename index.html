<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
</head>

<body>

    <main id="container"></main>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">



        // function Title(){
        //     return <h1>Hello React </h1>
        // };

        // function Paragraph(){
        //     return <p>Welcome to React course!</p>
        // };

        function ChatInput() {
            return (
                <div>
                    <input type = "text" placeholder ="Send a message to Chatbot" size ="30"/>
                    <button>Send</button>

                </div>
            );
        };

        function ChatMessage({ message, sender }) {


            if( sender === 'robot') {
                return(
                    <div>
                    <img src="./assets/robot.png" width="50" />
                    {message}
                </div>

                );
            };

            return(
                <div>
                    {message}
                    <img src="./assets/user.png" width="50" />
                </div>
            );
        };
         
        function App() {
            return (
                <>
                    <ChatInput/>
                    <ChatMessage message="Hello!" sender="user"/>
                    <ChatMessage message="Hello! How can I help you?" sender="robot"/>
                    <ChatMessage message="flip a coin." sender="user"/>
                    <ChatMessage message="Sure! you got tails." sender="robot"/>
                </>
            );
        };
            

        const container = document.querySelector('#container');
        // Transformou App em um componente.
        ReactDOM.createRoot(container).render(<App/>)

    </script>
</body>

</html>
